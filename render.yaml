services:
  - type: web
    name: docshield-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: API_KEYS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: VT_API_KEY
        sync: false
